name: check

on:
  pull_request:
  push:
    branches: [main, develop, 'release/**']

permissions:
  contents: read

jobs:
  agent-base:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project and test dependencies
        shell: powershell
        run: |
          $installable = (Test-Path pyproject.toml) -and
            (Select-String -Path pyproject.toml -Pattern '^\[build-system\]' -Quiet) -and
            (Select-String -Path pyproject.toml -Pattern '^\s*dev\s*=' -Quiet)
          if ($installable) {
            python -m pip install --quiet -e ".[dev]"
          } else {
            python -m pip install --quiet pyyaml
          }

      - name: Generated adapter files match their sources
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sync-adapters.ps1 -Check

      - name: Branch name and commit messages (pull requests only)
        if: github.event_name == 'pull_request'
        shell: powershell
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          $ok = $true
          $branchRe = '^(feature|bugfix|hotfix|fix|chore|refactor|docs|test|devops)/[0-9]+-[a-z0-9][a-z0-9-]*$'
          $releaseRe = '^release/[0-9]+\.[0-9]+\.[0-9]+'
          if (($env:HEAD_REF -notmatch $branchRe) -and ($env:HEAD_REF -notmatch $releaseRe)) {
            Write-Host "Bad branch name: $($env:HEAD_REF). Use <type>/<ticket>-<short-description> or release/<version>."
            $ok = $false
          }
          $commitRe = '^(feat|fix|chore|refactor|docs|test|ci|build|perf)\([a-z0-9._/-]+\)!?: .+'
          $subjects = @(git log --no-merges --format=%s "origin/$($env:BASE_REF)..origin/$($env:HEAD_REF)")
          foreach ($s in $subjects) {
            if ($s -match '^Revert ') { continue }
            if (($s -notmatch $commitRe) -or ($s.Length -gt 72)) { Write-Host "Bad commit subject: $s"; $ok = $false }
          }
          if (-not $ok) { exit 1 }
          Write-Host "Branch name and $($subjects.Count) commit subject(s) are valid."

      - name: Risk approval for reverts and mass deletions (pull requests only)
        if: github.event_name == 'pull_request'
        shell: powershell
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          $range = "origin/$($env:BASE_REF)..origin/$($env:HEAD_REF)"
          $deleted = @(git diff --diff-filter=D --name-only "origin/$($env:BASE_REF)...origin/$($env:HEAD_REF)").Count
          $subjects = @(git log --no-merges --format=%s $range)
          $isRevert = @($subjects | Where-Object { $_ -match '(?i)revert|hoan tac' }).Count -gt 0
          if (($deleted -ge 10) -or $isRevert) {
            $trailers = @(git log --no-merges --format=%B $range | Where-Object { $_ -match '^Risk-Approved: RK-[0-9]+$' })
            if ($trailers.Count -eq 0) {
              Write-Host "Risky change ($deleted deleted files, revert=$isRevert) but no 'Risk-Approved: RK-<n>' line in any commit. See agents/protocols/risk-gate.md."
              exit 1
            }
            foreach ($t in $trailers) {
              $n = $t -replace '^Risk-Approved: RK-', ''
              $f = "docs/risk/RK-$n.md"
              if (-not (Test-Path $f)) { Write-Host "$f not found."; exit 1 }
              if (-not (Select-String -Path $f -Pattern '^Status: APPROVED$' -Quiet)) { Write-Host "$f is not 'Status: APPROVED'."; exit 1 }
            }
            Write-Host "Risk approval found for this risky change."
          } else {
            Write-Host "No revert and $deleted deleted file(s): nothing to approve."
          }

      - name: Merge gate (branches named after a ticket)
        if: github.event_name == 'pull_request'
        shell: powershell
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ($env:HEAD_REF -match '^[a-z]+/([0-9]+)-') {
            $ticket = $Matches[1]
            $cards = @(Get-ChildItem -Path tasks -Recurse -Filter "T-$ticket.md" -File -ErrorAction SilentlyContinue)
            if ($cards.Count -gt 1) {
              Write-Host "Ambiguous task cards for T-$ticket.md:"
              $cards | ForEach-Object { Write-Host "  $($_.FullName)" }
              exit 1
            }
            if ($cards.Count -eq 1) {
              powershell -NoProfile -ExecutionPolicy Bypass -File scripts/merge-gate.ps1 -Branch "origin/$($env:HEAD_REF)" -Card $cards[0].FullName -Base "origin/$($env:BASE_REF)"
              exit $LASTEXITCODE
            }
            Write-Host "No task card T-$ticket.md under tasks/, skipping merge gate."
          } else {
            Write-Host "Branch is not named after a ticket, skipping merge gate."
          }

      - name: Task board schema (cards in tasks/)
        shell: powershell
        run: |
          if (Test-Path tasks/EPICS.md) {
            python scripts/task-board.py --check
          } else {
            Write-Host "No tasks/EPICS.md, skipping task board check."
          }

      - name: Hard rules (docs/HARD-RULES.json, changed files only)
        if: github.event_name == 'pull_request'
        shell: powershell
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/hard-check.py --changed-against "origin/$($env:BASE_REF)"

      - name: Feature Map matches the code (only if the project has one)
        if: github.event_name == 'pull_request'
        shell: powershell
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/feature-map-check.py --changed-against "origin/$($env:BASE_REF)"

      - name: Run Unit Tests
        shell: powershell
        run: python -m unittest discover -s tests -v

      - name: Generated adapters and notes index are fresh
        shell: powershell
        run: |
          python scripts/sync-adapters.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/notes-index.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Skill discovery bridges (Claude Code, Qoder)
        shell: powershell
        run: |
          python scripts/link-skills.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/link-skills.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Skills Registry Integrity
        shell: powershell
        run: python scripts/check-skills.py

      - name: Validate Knowledge Catalog
        shell: powershell
        run: |
          if (Test-Path agents/knowledge/knowledge-manifest.json) {
            python scripts/knowledge.py validate --root . --manifest agents/knowledge/knowledge-manifest.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Check Requirements Traceability Matrix (RTM)
        shell: powershell
        run: |
          if (Test-Path scripts/rtm.py) {
            python scripts/rtm.py --check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Diagnostic Task Claim Check (Advisory)
        shell: powershell
        run: |
          if ((Test-Path scripts/task-claim-check.py) -and (Test-Path tasks/E2-tri-thuc-quy-trinh/T-12.md)) {
            python scripts/task-claim-check.py --card tasks/E2-tri-thuc-quy-trinh/T-12.md
            Write-Host "Claim check chi la chan doan co van, khong lam CI do (exit $LASTEXITCODE)"
          }
          exit 0

      - name: Static Security Audit (CSO Scanner)
        shell: powershell
        run: python scripts/cso.py --strict

      - name: Repository Health Diagnostic (Doctor)
        shell: powershell
        run: python scripts/doctor.py

